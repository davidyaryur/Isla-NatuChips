<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video AR con Image Tracking (NFT)</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      /* Estilos sencillos para el botón de control */
      #playButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: sans-serif;
        font-weight: bold;
        background-color: #e50914;
        color: white;
        border: none;
        border-radius: 8px;
        z-index: 1000; /* Asegura que flote por encima de la cámara AR */
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
      }
      
      /* Opcional: estilo para un mensaje de carga, ya que NFT tarda un poco más en inicializar */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <div class="arjs-loader">
      <div>Cargando modelo AR, por favor espera...</div>
    </div>

    <button id="playButton">Reproducir Video AR</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="mi-video" 
               src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline>
        </video>
      </a-assets>

      <a-nft type="nft" url="./marcador" smooth="true" smoothCount="10" smoothTolerance=".01" smoothThreshold="5">
          <a-video src="#mi-video" 
                   width="1.6" 
                   height="0.9" 
                   position="0 0.05 0" 
                   rotation="-90 0 0">
          </a-video>
      </a-nft>

      <a-entity camera></a-entity>

    </a-scene>

    <script>
      const playButton = document.getElementById('playButton');
      const video = document.getElementById('mi-video');

      playButton.addEventListener('click', function () {
        // Al hacer clic, reproducimos el video
        video.play();
        
        // Cambiamos el texto del botón para que el usuario sepa que está activo
        playButton.innerText = "Video en Reproducción";
        playButton.style.backgroundColor = "#28a745"; // Cambia a verde
      });

      // Script para ocultar la pantalla de carga cuando la imagen se haya cargado
      window.addEventListener('arjs-nft-loaded', function () {
        document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
    
  </body>
</html>
