<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video AR NFT - Isla NatuChips</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    
    <style>
      /* Estilos para el botón de control */
      #playButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: sans-serif;
        font-weight: bold;
        background-color: #e50914;
        color: white;
        border: none;
        border-radius: 8px;
        z-index: 1000;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
      }
      
      /* Estilo para la pantalla de carga */
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <div class="arjs-loader">
      <div>Cargando modelo AR, por favor espera...</div>
    </div>

    <button id="playButton">Reproducir Video AR</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="mi-video" 
               src="./video.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline>
        </video>
      </a-assets>

      <a-nft type="nft" 
             url="https://davidyaryur.github.io/Isla-NatuChips/marcador" 
             smooth="true" smoothCount="300" smoothTolerance="10" smoothThreshold="30">
          
          <a-video src="#mi-video" 
                   width="16" 
                   height="09"
                   scale="5 5 5" 
                   position="30 0 -60" 
                   rotation="-45 0 0">
          </a-video>
      </a-nft>

      <a-entity camera></a-entity>

    </a-scene>

    <script>
      const playButton = document.getElementById('playButton');
      const video = document.getElementById('mi-video');

      playButton.addEventListener('click', function () {
        video.play();
        playButton.innerText = "Video en Reproducción";
        playButton.style.backgroundColor = "#28a745"; 
      });

      window.addEventListener('arjs-nft-loaded', function () {
        document.querySelector('.arjs-loader').style.display = 'none';
      });
    </script>
    
  </body>
</html>
