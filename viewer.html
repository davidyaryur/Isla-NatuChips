<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>NatuChips AR - Marcador</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #242424; /* Color de fondo mientras carga */
        }
        .instrucciones {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
        }
    </style>
</head>
<body style="margin : 0px; overflow: hidden;">

    <div class="instrucciones">
        Apunta tu cámara al marcador "HIRO"
    </div>

    <a-scene embedded arjs>
        
        <a-marker preset="hiro">
            
            <a-entity 
                gltf-model="https://raw.githubusercontent.com/davidyaryur/Isla-NatuChips/main/NatuChips.glb"
                scale="0.5 0.5 0.5" 
                rotation="-90 0 0"
                position="0 0 0">
            </a-entity>

        </a-marker>

        <a-entity camera></a-entity>
        
        <a-entity light="type: ambient; color: #BBB"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="-0.5 1 1"></a-entity>

    </a-scene>
</body>
</html>
