<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video AR + 3D Animado - Isla NatuChips</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      #playButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: sans-serif;
        font-weight: bold;
        background-color: #e50914;
        color: white;
        border: none;
        border-radius: 8px;
        z-index: 1000;
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <button id="playButton">Activar AR</button>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <video id="mi-video" 
               src="./video.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline>
        </video>

        <a-asset-item id="modelo3D" src="./speed.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-video src="#mi-video" 
                 width="1" 
                 height="0.5625" 
                 position="0 0 0" 
                 rotation="0 0 0">
        </a-video>

        <a-entity gltf-model="#modelo3D"
                  scale="0.8 0.8 0.8"  
                  position="0 0 0"
                  animation-mixer>
        </a-entity>

      </a-entity>

    </a-scene>

    <script>
      const playButton = document.getElementById('playButton');
      const video = document.getElementById('mi-video');
      const target = document.querySelector('[mindar-image-target]');

      playButton.addEventListener('click', function () {
        video.play();
        video.pause(); 
        playButton.innerText = "¡Escanea la Isla NatuChips!";
        playButton.style.backgroundColor = "#28a745"; 
      });

      target.addEventListener("targetFound", event => {
        video.play();
      });

      target.addEventListener("targetLost", event => {
        video.pause();
      });
    </script>
    
  </body>
</html>
