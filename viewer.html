<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Babylon.js Personalizado</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #222222;
            font-family: sans-serif;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
            outline: none;
        }
        
        /* --- ESTILOS DE LA PANTALLA DE INICIO --- */
        #splashScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #222222; /* Mismo color de fondo */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000; /* Por encima de toda la UI */
            transition: opacity 0.5s ease-in-out;
        }

        #startBtn {
            background-color: #1b5e20; /* Verde oscuro */
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 50px; /* Forma de cápsula */
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        #startBtn:hover {
            background-color: #2e7d32; /* Un verde un poco más claro al pasar el ratón */
        }

        #startBtn:active {
            transform: scale(0.95); /* Pequeño efecto de pulsación */
        }
        /* ---------------------------------------- */

        #uiContainer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        #uiContainer::before {
            content: "";
            position: absolute;
            top: -30px; bottom: -30px; left: -30px; right: -30px;
            z-index: -1;
        }
        #uiContainer:hover, #uiContainer:focus-within { opacity: 1; }

        .btn-main {
            background-color: #555555;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-main:hover { background-color: #777777; }

        #uploadBtn { padding: 12px 24px; font-size: 16px; }
        #fileInput { display: none; }

        .panel {
            position: absolute;
            background-color: rgba(34, 34, 34, 0.85);
            border-radius: 12px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #444;
            opacity: 0; 
            transition: opacity 0.3s ease-in-out;
        }
        .panel::before {
            content: "";
            position: absolute;
            top: -40px; bottom: -40px; left: -40px; right: -40px;
            z-index: -1;
        }
        .panel:hover, .panel:focus-within { opacity: 1; }
        .panel.horizontal { padding: 15px 25px; gap: 15px; }
        .panel.vertical { padding: 20px 10px; flex-direction: column; gap: 15px; }

        #exposurePanel { top: 20px; left: 50%; transform: translateX(-50%); }
        #panXPanel { bottom: 30px; left: 50%; transform: translateX(-50%); }
        #panYPanel { left: 20px; top: 50%; transform: translateY(-50%); }
        #zoomPanel { right: 20px; top: 50%; transform: translateY(-50%); }
        
        #fullscreenPanel { bottom: 20px; right: 20px; padding: 10px; }
        #fullscreenBtn { width: 44px; height: 44px; font-size: 24px; line-height: 1; }

        input[type="range"] { cursor: pointer; }
        .slider-horiz { width: 150px; }
        .slider-vert {
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            width: 8px;
            height: 150px;
        }
        #zoomSlider { transform: rotate(180deg); }

        .label {
            font-size: 14px;
            font-weight: bold;
            min-width: 90px;
            text-align: center;
        }

        .reset-btn {
            background-color: transparent;
            color: #aaa;
            border: 1px solid #777;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
            padding: 0;
            line-height: 1;
        }
        .reset-btn:hover { background-color: #888; color: white; border-color: #bbb; }
    </style>
</head>
<body>
    
    <div id="splashScreen">
        <button id="startBtn">Iniciar</button>
    </div>

    <div id="uiContainer">
        <button id="uploadBtn" class="btn-main">Cargar Modelo (.glb / .gltf)</button>
        <input type="file" id="fileInput" accept=".glb, .gltf">
    </div>

    <div id="exposurePanel" class="panel horizontal">
        <span id="exposureLabel" class="label">Luz: 1.0</span>
        <input type="range" id="exposureSlider" class="slider-horiz" min="0" max="10" step="0.1" value="4">
        <button id="exposureReset" class="reset-btn" title="Restablecer Luz">↺</button>
    </div>

    <div id="panXPanel" class="panel horizontal">
        <span class="label">X (Izq/Der)</span>
        <input type="range" id="panXSlider" class="slider-horiz">
        <button id="panXReset" class="reset-btn" title="Restablecer Precisión">↺</button>
    </div>

    <div id="panYPanel" class="panel vertical">
        <button id="panYReset" class="reset-btn" title="Restablecer Precisión">↺</button>
        <input type="range" id="panYSlider" class="slider-vert" orient="vertical">
        <span class="label">Y<br>(Arr/Aba)</span>
    </div>

    <div id="zoomPanel" class="panel vertical">
        <button id="zoomReset" class="reset-btn" title="Restablecer Precisión">↺</button>
        <input type="range" id="zoomSlider" class="slider-vert" orient="vertical">
        <span class="label">Zoom</span>
    </div>

    <div id="fullscreenPanel" class="panel">
        <button id="fullscreenBtn" class="btn-main" title="Pantalla Completa">⛶</button>
    </div>

    <canvas id="renderCanvas" oncontextmenu="return false;"></canvas>

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

    <script>
        // --- LÓGICA DE LA PANTALLA DE INICIO ---
        const splashScreen = document.getElementById("splashScreen");
        const startBtn = document.getElementById("startBtn");

        startBtn.addEventListener("click", () => {
            // Solicitar pantalla completa
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error al intentar activar el modo pantalla completa: ${err.message}`);
                });
            }
            
            // Ocultar la pantalla con transición
            splashScreen.style.opacity = "0";
            setTimeout(() => {
                splashScreen.style.display = "none";
            }, 500); // 500ms coincide con la transición CSS
        });


        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        
        let currentModelMeshes = [];
        let camera; 

        // Clase controladora de sensibilidad de barras
        class DynamicSlider {
            constructor(sliderId, resetBtnId, initialSens, invert, onChangeCallback) {
                this.slider = document.getElementById(sliderId);
                this.resetBtn = document.getElementById(resetBtnId);
                this.initialSens = initialSens;
                this.sens = initialSens; 
                this.baseValue = 0;      
                this.invert = invert ? -1 : 1;
                this.onChange = onChangeCallback;
                
                this.slider.min = -100;
                this.slider.max = 100;
                this.slider.value = 0;

                this.slider.addEventListener("input", (e) => {
                    let offset = parseFloat(e.target.value);
                    this.onChange(this.baseValue + (offset * this.sens * this.invert));
                });

                this.slider.addEventListener("change", (e) => {
                    let offset = parseFloat(e.target.value);
                    this.baseValue += (offset * this.sens * this.invert);
                    if (Math.abs(offset) >= 99) {
                        this.sens *= 3.0; 
                        this.slider.value = 0; 
                    }
                });

                this.resetBtn.addEventListener("click", () => {
                    let offset = parseFloat(this.slider.value);
                    this.baseValue += (offset * this.sens * this.invert);
                    this.sens = this.initialSens; 
                    this.slider.value = 0;        
                });
            }
            syncWithCanvas(absoluteValue) {
                if (!this.slider.matches(':active')) {
                    this.baseValue = absoluteValue;
                    this.slider.value = 0; 
                }
            }
            fullReset(newBaseValue) {
                this.baseValue = newBaseValue;
                this.sens = this.initialSens;
                this.slider.value = 0;
            }
        }

        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.12, 0.12, 0.12, 1);

            camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2.5, 5, new BABYLON.Vector3(0, 0, 0), scene);
            camera.attachControl(canvas, true);
            camera.wheelPrecision = 50; 
            camera.minZ = 0.1;

            // Paneo inteligente (Ratón)
            camera.panningSensibility = 3000; 
            let lastPointerTime = 0;
            let lastPointerX = 0;
            let lastPointerY = 0;
            let isPanningWithMouse = false;

            scene.onPointerObservable.add((pointerInfo) => {
                const evt = pointerInfo.event;

                if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                    if (evt.button === 1 || evt.button === 2 || (evt.button === 0 && evt.shiftKey)) {
                        camera.panningMouseButton = evt.button; 
                        isPanningWithMouse = true;
                        
                        lastPointerTime = performance.now();
                        lastPointerX = evt.clientX;
                        lastPointerY = evt.clientY;
                    } 
                    else if (evt.button === 0) {
                        camera.panningMouseButton = 2; 
                    }
                }
                else if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERUP) {
                    isPanningWithMouse = false;
                    camera.panningSensibility = 3000; 
                }
                else if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERMOVE) {
                    if (isPanningWithMouse) {
                        let currentTime = performance.now();
                        let dt = currentTime - lastPointerTime;

                        if (dt > 0) {
                            let dx = evt.clientX - lastPointerX;
                            let dy = evt.clientY - lastPointerY;
                            let distance = Math.sqrt(dx * dx + dy * dy);
                            let speed = distance / dt;

                            // 1. Ampliamos el límite de velocidad tope
                            let maxSpeed = 7.0; 
                            let minSpeed = 0.1;
                            let mappedSpeed = Math.min(Math.max(speed, minSpeed), maxSpeed);

                            // 2. Normalizamos la velocidad a un valor entre 0 y 1
                            let speedFactor = (mappedSpeed - minSpeed) / (maxSpeed - minSpeed);

                            // 3. Aplicamos una curva exponencial (cúbica)
                            let curve = Math.pow(speedFactor, 3);

                            let maxSensibility = 3000; // Movimiento quirúrgico
                            let minSensibility = 200;  // Movimiento brusco

                            let targetSensibility = maxSensibility - (curve * (maxSensibility - minSensibility));

                            // 4. Suavizado (Lerp) ajustado
                            camera.panningSensibility = (camera.panningSensibility * 0.8) + (targetSensibility * 0.2);
                        }

                        lastPointerTime = currentTime;
                        lastPointerX = evt.clientX;
                        lastPointerY = evt.clientY;
                    }
                }
            });

            // Ajustes visuales de iluminación
            const envTexture = BABYLON.CubeTexture.CreateFromPrefilteredData("https://assets.babylonjs.com/environments/environmentSpecular.env", scene);
            scene.environmentTexture = envTexture;
            scene.environmentIntensity = 2; 

            scene.imageProcessingConfiguration.contrast = 1;
            scene.imageProcessingConfiguration.exposure = 1;
            scene.imageProcessingConfiguration.vignetteEnabled = true;
            scene.imageProcessingConfiguration.vignetteWeight = 0.5;
            scene.imageProcessingConfiguration.vignetteBlendMode = BABYLON.ImageProcessingConfiguration.VIGNETTEMODE_MULTIPLY;
            scene.imageProcessingConfiguration.vignetteColor = new BABYLON.Color4(0, 0, 0, 1);
            scene.imageProcessingConfiguration.ditheringEnabled = true;
            scene.imageProcessingConfiguration.ditheringIntensity = 0.0039;

            return scene;
        };

        const scene = createScene();

        // Inicializar controles UI
        const exposureSlider = document.getElementById("exposureSlider");
        const exposureLabel = document.getElementById("exposureLabel");
        exposureSlider.addEventListener("input", (evt) => {
            scene.imageProcessingConfiguration.exposure = parseFloat(evt.target.value);
            exposureLabel.innerText = `Luz: ${parseFloat(evt.target.value).toFixed(1)}`;
        });
        document.getElementById("exposureReset").addEventListener("click", () => {
            exposureSlider.value = 1;
            scene.imageProcessingConfiguration.exposure = 1;
            exposureLabel.innerText = `Luz: 4.0`;
        });

        const zoomControl = new DynamicSlider("zoomSlider", "zoomReset", 0.01, false, (val) => {
            if (camera) camera.radius = val;
        });
        const panXControl = new DynamicSlider("panXSlider", "panXReset", 0.005, true, (val) => {
            if (camera && camera.target) camera.target.x = val;
        });
        const panYControl = new DynamicSlider("panYSlider", "panYReset", 0.005, true, (val) => {
            if (camera && camera.target) camera.target.y = val;
        });

        const fullscreenBtn = document.getElementById("fullscreenBtn");
        fullscreenBtn.addEventListener("click", () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => console.error(err));
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // --- FUNCIÓN MAESTRA DE CARGA DE MODELOS ---
        function loadModel(fileOrString, isLocalFile = false) {
            // Eliminar modelo anterior de la memoria
            if (currentModelMeshes.length > 0) { 
                currentModelMeshes.forEach(mesh => mesh.dispose()); 
                currentModelMeshes = []; 
            }

            let loadPromise;
            
            if (isLocalFile) {
                // Carga desde el botón (PC del usuario)
                loadPromise = BABYLON.SceneLoader.ImportMeshAsync("", "file:", fileOrString, scene);
            } else {
                // Carga desde el repositorio web
                loadPromise = BABYLON.SceneLoader.ImportMeshAsync("", "./", fileOrString, scene);
            }

            loadPromise.then((result) => {
                currentModelMeshes = result.meshes;
                let boundingInfo = result.meshes[0].getHierarchyBoundingVectors();
                let center = boundingInfo.min.add(boundingInfo.max).scale(0.5);
                camera.setTarget(center); 
                
                camera.useFramingBehavior = true;
                const framingBehavior = camera.getBehaviorByName("Framing");
                framingBehavior.framingTime = 0; 
                framingBehavior.elevationReturnTime = -1;

                scene.onBeforeRenderObservable.addOnce(() => {
                    zoomControl.fullReset(camera.radius);
                    panXControl.fullReset(camera.target.x);
                    panYControl.fullReset(camera.target.y);
                });
            }).catch(error => {
                console.warn("Hubo un problema cargando el modelo:", error);
            });
        }

        // --- CARGA INICIAL DESDE GITHUB ---
        loadModel("NatuChips.glb", false);

        // --- CARGA MANUAL DESDE EL BOTÓN ---
        const fileInput = document.getElementById("fileInput");
        const uploadBtn = document.getElementById("uploadBtn");
        uploadBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", (evt) => {
            const file = evt.target.files[0];
            if (!file) return;
            loadModel(file, true);
            fileInput.value = "";
        });

        // Loop de renderizado
        engine.runRenderLoop(function () {
            scene.render();
            if (camera && camera.target) {
                zoomControl.syncWithCanvas(camera.radius);
                panXControl.syncWithCanvas(camera.target.x);
                panYControl.syncWithCanvas(camera.target.y);
            }
        });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
