<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga Rápida y Clic Real</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            color: #333;
            text-align: center;
        }

        h1 { font-size: 3rem; color: #2c3e50; margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; color: #555; margin-bottom: 1.5rem; }

        #btn-mostrar {
            padding: 12px 24px;
            font-size: 1.1rem;
            color: white;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #btn-mostrar:hover {
            background-color: #2980b9;
        }

        #pagina-oculta-iframe {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.1; 
            transition: opacity 0.5s ease; 
        }
    </style>
</head>
<body>

    <div id="contenedor-principal">
        <h1>Página lista</h1>
        <p>Lee esta información tranquilamente. La página pesada ya se está cargando en secreto.</p>
        <button id="btn-mostrar">Ver contenido cargado</button>
    </div>

    <iframe id="pagina-oculta-iframe" src="https://mywebar.com/p/YarYurProtex"></iframe>

    <script>
        const btnMostrar = document.getElementById('btn-mostrar');
        const contenedorPrincipal = document.getElementById('contenedor-principal');
        const iframeOculto = document.getElementById('pagina-oculta-iframe');

        btnMostrar.addEventListener('click', () => {
            // 1. Ocultamos el menú inicial y mostramos el iframe
            contenedorPrincipal.style.display = 'none';
            iframeOculto.style.display = 'block';
            
            // 2. EL TRUCO: Escuchamos cuando nuestra ventana principal pierde el "foco"
            // Esto ocurre en el momento exacto en que el usuario hace clic dentro del iframe
            window.addEventListener('blur', () => {
                // Verificamos si lo que robó el foco fue nuestro iframe
                if (document.activeElement === iframeOculto) {
                    // Subimos la opacidad al 100%
                    iframeOculto.style.opacity = '1';
                }
            }, { once: true }); // El { once: true } asegura que esto solo pase con el PRIMER clic
        });
    </script>

</body>
</html>
