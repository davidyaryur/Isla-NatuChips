<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Trasera y Carga Rápida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
            color: #333;
            text-align: center;
        }

        h1 { font-size: 3rem; color: #2c3e50; margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; color: #555; margin-bottom: 1.5rem; }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
            transition: background-color 0.3s ease;
        }

        #btn-mostrar { background-color: #3498db; }
        #btn-mostrar:hover { background-color: #2980b9; }

        #btn-camara { background-color: #2ecc71; }
        #btn-camara:hover { background-color: #27ae60; }

        #video-camara {
            display: none; 
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        #pagina-oculta-iframe {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0.05; 
            transition: opacity 0.5s ease;
        }

        /* --- NUEVO: Estilos para el overlay y la píldora --- */
        #overlay-experiencia {
            display: none; /* Oculto inicialmente */
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            /* MUY IMPORTANTE: Permite que los clics traspasen la píldora y lleguen al iframe */
            pointer-events: none; 
        }

        .pildora {
            background-color: rgba(44, 62, 80, 0.9);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: opacity 0.5s ease; /* Para desvanecerla al final */
        }
    </style>
</head>
<body>

    <div id="contenedor-principal">
        <h1>Página lista</h1>
        <p>Lee esta información tranquilamente. La página pesada ya se está cargando.</p>
        
        <div>
            <button id="btn-mostrar">Ver contenido cargado</button>
            <button id="btn-camara">Encender Cámara Trasera</button>
        </div>

        <video id="video-camara" autoplay playsinline></video>
    </div>

    <div id="overlay-experiencia">
        <div class="pildora" id="pildora-ui">
            <span id="texto-overlay">Comenzar experiencia</span>
        </div>
    </div>

    <iframe id="pagina-oculta-iframe" src="https://mywebar.com/p/YarYurProtex" allow="camera; microphone"></iframe>

    <script>
        // --- LÓGICA DEL IFRAME OCULTO Y CUENTA REGRESIVA ---
        const btnMostrar = document.getElementById('btn-mostrar');
        const contenedorPrincipal = document.getElementById('contenedor-principal');
        const iframeOculto = document.getElementById('pagina-oculta-iframe');
        
        // Elementos nuevos
        const overlayExperiencia = document.getElementById('overlay-experiencia');
        const textoOverlay = document.getElementById('texto-overlay');
        const pildoraUI = document.getElementById('pildora-ui');

        btnMostrar.addEventListener('click', () => {
            contenedorPrincipal.style.display = 'none';
            iframeOculto.style.display = 'block';
            
            // Mostramos la píldora con el texto inicial
            overlayExperiencia.style.display = 'block';
            
            window.addEventListener('blur', () => {
                if (document.activeElement === iframeOculto) {
                    
                    let contador = 5;
                    textoOverlay.textContent = contador; // Cambia a "5" inmediatamente al hacer clic
                    
                    // Reemplazamos setTimeout por setInterval para actualizar cada segundo
                    const intervalo = setInterval(() => {
                        contador--;
                        
                        if (contador > 0) {
                            textoOverlay.textContent = contador;
                        } else {
                            // Cuando llega a 0
                            textoOverlay.textContent = "¡Explora!";
                            iframeOculto.style.opacity = '1'; // Subimos la opacidad del iframe
                            clearInterval(intervalo); // Detenemos la cuenta regresiva
                            
                            // Ocultamos la píldora suavemente después de 1 segundo para que vean el "¡Explora!"
                            setTimeout(() => {
                                pildoraUI.style.opacity = '0';
                                setTimeout(() => {
                                    overlayExperiencia.style.display = 'none';
                                }, 500); // Espera a que termine la animación de opacidad
                            }, 1000);
                        }
                    }, 1000); // Se ejecuta cada 1000 ms (1 segundo)
                }
            }, { once: true });
        });

        // --- LÓGICA DE LA CÁMARA TRASERA (Sin cambios) ---
        const btnCamara = document.getElementById('btn-camara');
        const videoCamara = document.getElementById('video-camara');

        btnCamara.addEventListener('click', async () => {
            try {
                const restricciones = {
                    video: {
                        facingMode: "environment"
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(restricciones);
                
                videoCamara.srcObject = stream;
                videoCamara.style.display = 'block';
                
                btnCamara.textContent = "Cámara Trasera Activa";
                btnCamara.disabled = true;
                btnCamara.style.backgroundColor = "#95a5a6";
                btnCamara.style.cursor = "default";

            } catch (error) {
                alert('No se pudo acceder a la cámara trasera. Asegúrate de estar en un dispositivo móvil o de tener una conectada.');
                console.error('Error de cámara:', error);
            }
        });
    </script>

</body>
</html>
