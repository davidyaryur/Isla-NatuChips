<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Video AR en Marcador</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* Estilos sencillos para el botón de control */
      #playButton {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 16px;
        font-family: sans-serif;
        font-weight: bold;
        background-color: #e50914;
        color: white;
        border: none;
        border-radius: 8px;
        z-index: 1000; /* Asegura que flote por encima de la cámara AR */
        cursor: pointer;
        box-shadow: 0px 4px 6px rgba(0,0,0,0.3);
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <button id="playButton">Reproducir Video AR</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      
      <a-assets>
        <video id="mi-video" 
               src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" 
               preload="auto" 
               loop 
               crossorigin="anonymous" 
               webkit-playsinline 
               playsinline>
        </video>
      </a-assets>

      <a-marker type="pattern" url="marcador.patt">
        <a-video src="#mi-video" 
                 width="1.6" 
                 height="0.9" 
                 position="0 0.05 0" 
                 rotation="-90 0 0">
        </a-video>
      </a-marker>

      <a-entity camera></a-entity>

    </a-scene>

    <script>
      const playButton = document.getElementById('playButton');
      const video = document.getElementById('mi-video');

      playButton.addEventListener('click', function () {
        // Al hacer clic, reproducimos el video
        video.play();
        
        // Cambiamos el texto del botón para que el usuario sepa que está activo
        playButton.innerText = "Video en Reproducción";
        playButton.style.backgroundColor = "#28a745"; // Cambia a verde
        
        // Opcional: si quieres que el botón desaparezca, puedes descomentar la siguiente línea
        // playButton.style.display = 'none';
      });
    </script>
    
  </body>
</html>
